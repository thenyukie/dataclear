<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DataClear — Compliance Demo Journey</title>
<meta name="description" content="DataClear — converting privacy regulations into deterministic, explainable decision trees. Interactive demo: watch a use case travel all 14 pipeline stages.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <span class="logo">DATACLEAR://</span>
  <nav class="topbar-nav">
    <a href="#" class="active">Demo Journey</a>
  </nav>
  <div class="topbar-ctl">
    <button class="ctl" id="btn-prev" type="button" title="Previous stage (←)">◂ PREV</button>
    <button class="ctl" id="btn-next" type="button" title="Next stage (→)">NEXT ▸</button>
    <button class="ctl" id="btn-restart" type="button" title="Replay from intake">⟲ REPLAY</button>
  </div>
  <span class="clock" id="clock">SYNC --:--:-- UTC</span>
</div>

<div class="stepper" id="stepper"><!-- dynamic stepper: pinned START/FINISH caps; pills fill in as the case travels --></div>

<div class="main">

  <!-- LEFT: chat -->
  <section class="pane chat-pane" aria-label="Chat with DataClear">
    <div class="pane-head">
      <h2>Teams Chat · DataClear Bot</h2>
      <span class="pill live" id="status-pill">BOOTING…</span>
    </div>
    <div class="chat-body" id="chat"></div>
    <div class="typing" id="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="typing-note">DataClear is typing…</span></div>
    <div class="chips" id="chips"></div>
    <div class="chat-input">
      <input id="chatin" type="text" placeholder="Type a reply, or tap a suggestion…" autocomplete="off">
      <button id="chatsend" type="button">Send</button>
    </div>
  </section>

  <!-- RIGHT: agent workspace -->
  <section class="pane" aria-label="Agent workspace">
    <div class="pane-head">
      <h2 id="stage-title">Workspace</h2>
      <span class="pill">deterministic · cited-or-silent</span>
    </div>
    <div class="tabbar" role="tablist">
      <button class="tabbtn active" data-tab="trace" role="tab">Trace</button>
      <button class="tabbtn" data-tab="artifacts" role="tab">Artifacts</button>
      <button class="tabbtn" data-tab="people" role="tab">People</button>
      <button class="tabbtn" data-tab="systems" role="tab">Systems</button>
    </div>
    <div class="tabpanel active" id="tab-trace" role="tabpanel"><ul></ul></div>
    <div class="tabpanel" id="tab-artifacts" role="tabpanel"><ul></ul></div>
    <div class="tabpanel" id="tab-people" role="tabpanel"><ul></ul></div>
    <div class="tabpanel" id="tab-systems" role="tabpanel"><ul></ul></div>
  </section>

</div>

<footer>DATACLEAR:// demo v0.6 · case UC26 · longest-path journey · every verdict traceable to its encoded rule · no personal data processed</footer>

<script src="stages.js"></script>
<script src="demo.js"></script>
<script>
(function () {
  var el = document.getElementById('clock');
  function tick() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    el.textContent = 'SYNC ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds()) + ' UTC';
  }
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
